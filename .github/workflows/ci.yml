name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (lua 5.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run repository-controlled commands (just, test/*.sh).
          # Do not leave a usable token in the git config for them.
          persist-credentials: false

      # mise provisions the pinned dev tools (bun, etc.) from mise.toml.
      # install + cache keep CI in lockstep with local dev.
      - name: Set up mise tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # mise supplies lua, luarocks (bundled with the lua plugin), just and
      # pandoc. Fail here with a readable message rather than in a later step.
      # leafo/gh-actions-luarocks is deliberately absent: it configures against
      # a ./.lua directory that only leafo/gh-actions-lua creates.
      - name: Verify toolchain
        run: |
          lua -v
          luarocks --version | head -1
          just --version
          pandoc --version | head -1
          pandoc --version | head -1 | awk '{split($2, v, "."); if (v[1] < 3 || (v[1] == 3 && v[2] < 10))
            { print "pandoc " $2 " is too old; the custom reader API needs 3.10+"; exit 1 }}'

      # busted is a luarocks package rather than a mise tool. --lr-bin returns a
      # colon-joined list, and $GITHUB_PATH takes one entry per line.
      - name: Install busted
        run: |
          luarocks install --local busted
          luarocks path --lr-bin | tr ':' '\n' >> "$GITHUB_PATH"

      # The suite arrives incrementally: the justfile and test/ in Task 1,
      # test/golden.sh in Task 9, test/filters.sh in Task 10, test/cli.sh in
      # Task 12. Gate each phase on its own assets, so an intermediate PR is not
      # failed by a recipe whose script does not exist yet, and say out loud what
      # was skipped. `unit` needs test/ as well as the runner: busted against a
      # missing directory is either an error or a meaninglessly green run.
      - name: Detect available test assets
        id: assets
        run: |
          detect() {
            if [ -e "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Phase unavailable::$2 not present; the '$1' phase was skipped. See docs/plan.md."
            fi
          }
          detect runner  justfile
          detect unit    test
          detect golden  test/golden.sh
          detect filters test/filters.sh
          detect cli     test/cli.sh

      - name: Unit tests (busted)
        if: steps.assets.outputs.runner == 'true' && steps.assets.outputs.unit == 'true'
        run: just unit

      - name: Golden-file tests
        if: steps.assets.outputs.runner == 'true' && steps.assets.outputs.golden == 'true'
        run: just golden

      - name: Filter integration tests
        if: steps.assets.outputs.runner == 'true' && steps.assets.outputs.filters == 'true'
        run: just filters

      - name: CLI tests
        if: steps.assets.outputs.runner == 'true' && steps.assets.outputs.cli == 'true'
        run: just cli
