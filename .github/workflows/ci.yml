name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The custom reader API and GitHub-alert parsing both require pandoc 3.10+.
  PANDOC_VERSION: "3.10.1"

jobs:
  test:
    name: test (lua ${{ matrix.lua-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.4 is the target runtime. 5.5 runs too, so regressions surface early.
        lua-version: ["5.4", "5.5"]

    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps run repository-controlled commands (make, test/*.sh).
          # Do not leave a usable token in the git config for them.
          persist-credentials: false

      - name: Set up Lua ${{ matrix.lua-version }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install busted
        run: luarocks install busted

      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      # The suite arrives incrementally: Makefile in Task 1, test/golden.sh in
      # Task 9, test/filters.sh in Task 10, test/cli.sh in Task 12. Gate each
      # phase on its own assets, so an intermediate PR is not failed by a target
      # whose script does not exist yet, and say out loud what was skipped.
      - name: Detect available test assets
        id: assets
        run: |
          detect() {
            if [ -e "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Phase unavailable::$2 not present; the '$1' phase was skipped. See docs/plan.md."
            fi
          }
          detect unit    Makefile
          detect golden  test/golden.sh
          detect filters test/filters.sh
          detect cli     test/cli.sh

      - name: Unit tests (busted)
        if: steps.assets.outputs.unit == 'true'
        run: make unit

      - name: Golden-file tests
        if: steps.assets.outputs.unit == 'true' && steps.assets.outputs.golden == 'true'
        run: make golden

      - name: Filter integration tests
        if: steps.assets.outputs.unit == 'true' && steps.assets.outputs.filters == 'true'
        run: make filters

      - name: CLI tests
        if: steps.assets.outputs.unit == 'true' && steps.assets.outputs.cli == 'true'
        run: make cli
