name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (lua 5.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run repository-controlled commands (just, test/*.sh).
          # Do not leave a usable token in the git config for them.
          persist-credentials: false

      # mise provisions the pinned toolchain (lua, pandoc, just, shellcheck)
      # from mise.toml. install + cache keep CI in lockstep with local dev.
      - name: Set up mise tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # mise supplies lua, luarocks (bundled with the lua plugin), just and
      # pandoc. Fail here with a readable message rather than in a later step.
      # leafo/gh-actions-luarocks is deliberately absent: it configures against
      # a ./.lua directory that only leafo/gh-actions-lua creates.
      - name: Verify toolchain
        run: |
          lua -v
          luarocks --version | head -1
          just --version
          pandoc --version | head -1
          pandoc --version | head -1 | awk '{split($2, v, "."); if (v[1] < 3 || (v[1] == 3 && v[2] < 10))
            { print "pandoc " $2 " is too old; the custom reader API needs 3.10+"; exit 1 }}'

      # busted is declared once, in markua-pandoc-dev-1.rockspec; `just install`
      # reads it from there. --lr-bin returns a colon-joined list, and
      # $GITHUB_PATH takes one entry per line.
      - name: Install dev dependencies
        run: |
          just install
          luarocks path --lr-bin | tr ':' '\n' >> "$GITHUB_PATH"

      # The suite arrives incrementally, so a phase runs only once it exists.
      # Presence is decided by whether the JUSTFILE defines the recipe, not by
      # a path duplicated here: the justfile names the script, so renaming
      # test/golden.sh without updating it makes `just golden` FAIL loudly
      # rather than silently skipping forever. Skips are warnings, not notices,
      # so they surface in the PR rather than only in the job log.
      - name: Detect available test phases
        id: phases
        run: |
          recipes=""
          if [ -f justfile ]; then
            recipes=$(just --summary 2>/dev/null || true)
          else
            echo "::warning title=Phase skipped::No justfile yet; no test phase ran. See docs/plan.md Task 1."
          fi

          has_recipe() {
            echo "$recipes" | tr ' ' '\n' | grep -qx "$1"
          }

          for phase in unit golden filters cli; do
            ok=true
            reason=""
            if ! has_recipe "$phase"; then
              ok=false
              reason="the justfile has no '$phase' recipe yet"
            elif [ "$phase" = unit ] && [ ! -d test ]; then
              # busted exits 1 on a missing tree; skipping is the clearer signal.
              ok=false
              reason="test/ does not exist yet"
            fi
            echo "$phase=$ok" >> "$GITHUB_OUTPUT"
            if [ "$ok" = false ]; then
              echo "::warning title=Phase skipped::${reason}; the '$phase' phase did not run. See docs/plan.md."
            fi
          done

      - name: Unit tests (busted)
        if: steps.phases.outputs.unit == 'true'
        run: just unit

      - name: Golden-file tests
        if: steps.phases.outputs.golden == 'true'
        run: just golden

      - name: Filter integration tests
        if: steps.phases.outputs.filters == 'true'
        run: just filters

      - name: CLI tests
        if: steps.phases.outputs.cli == 'true'
        run: just cli
